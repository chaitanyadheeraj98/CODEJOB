[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "beautifulsoup4>=4.13.5",
    # Already present transitively via rq, and used directly for schedule
    # computation. Declared so an rq upgrade that drops or replaces it fails
    # resolution instead of silently breaking every schedule in the product.
    "croniter>=6.2.2",
    "fastapi>=0.136.1",
    "google-api-python-client>=2.181.0",
    "google-auth-oauthlib>=1.2.2",
    "httpx>=0.28.1",
    "lxml>=6.0.2",
    "openai>=2.33.0",
    "python-multipart>=0.0.20",
    "pydantic-settings>=2.14.0",
    "redis>=7.4.0",
    "rq>=2.8.0",
    "sentence-transformers>=5.1.0",
    "sqlalchemy>=2.0.49",
    "tzdata>=2025.2",
    "unstructured[pdf,docx]>=0.25.2,<1.0.0",
    "uvicorn[standard]>=0.46.0",
    "pypdf>=6.14.2,<7.0.0",
    "instructor==1.15.4",
    "langgraph==1.2.11",
    "langchain-core==1.5.4",
    "langchain-ollama==1.1.0",
    "mcp==1.29.0",
    "langchain-mcp-adapters==0.3.2",
    "psycopg2-binary>=2.9.12",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-testmon>=2.2.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
timeout = 60
