name: Database migrations

on:
  pull_request:
    paths:
      - "backend/alembic/**"
      - "backend/app/db.py"
      - "backend/app/models.py"
      - "backend/scripts/verify_schema_equivalence.py"
      - "backend/tests/test_migration_0018.py"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - ".github/workflows/db-migrations.yml"
  push:
    paths:
      - "backend/alembic/**"
      - "backend/app/db.py"
      - "backend/app/models.py"
      - "backend/scripts/verify_schema_equivalence.py"
      - "backend/tests/test_migration_0018.py"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - ".github/workflows/db-migrations.yml"

jobs:
  sqlite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite:///./migration-ci.db
      DEBUG: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run alembic upgrade head
      - run: uv run python scripts/verify_schema_equivalence.py --database-url "$DATABASE_URL"
      - run: uv run pytest tests/test_migration_0018.py

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: codejob_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d codejob_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/codejob_test
      DEBUG: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run alembic upgrade head
      - run: uv run python scripts/verify_schema_equivalence.py --database-url "$DATABASE_URL"
      - run: uv run pytest tests/test_migration_0018.py
