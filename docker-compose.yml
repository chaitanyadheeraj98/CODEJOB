services:
  backend:
    build:
      context: ./backend
    container_name: codejob-backend
    env_file:
      - ./backend/.env
      - ./backend/.env.postgres
    environment:
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # C4: the API serves requests and must not carry torch. Every embedding
      # belongs to the worker. See app/torch_guard.py for the measurement.
      API_EMBEDDINGS_ENABLED: "false"
    # `exec` so uvicorn replaces the shell and becomes PID 1. Without it the
    # shell is PID 1, SIGTERM stops at the shell, uvicorn never sees it, and
    # the container is SIGKILLed at the end of the grace period - exit 137, no
    # graceful shutdown, so lifespan teardown never runs.
    # `--no-access-log` because F3's `log_request_summary` replaces it, and
    # uvicorn's version writes the full request line - **including the query
    # string**. Nine endpoints take a free-text `q`, and people paste recruiter
    # addresses and subject lines into search boxes, so that line was writing
    # exactly the content §12.1 forbids recording. Ours logs the route
    # template and never the query.
    command: >
      sh -c "alembic upgrade head &&
      exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
      --no-access-log"
    # The default 10s is not enough for lifespan teardown: it stops the
    # auto-runner thread and the Telegram poller, each joined with a 5s
    # timeout. Cut short, the container dies with 137 instead of exiting
    # cleanly.
    stop_grace_period: 30s
    ports:
      - "8000:8000"
      - "8080:8080"
    volumes:
      - backend_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      searxng:
        condition: service_started

  worker:
    build:
      context: ./backend
    container_name: codejob-worker
    env_file:
      - ./backend/.env
      - ./backend/.env.postgres
    environment:
      REDIS_URL: redis://redis:6379/0
      # C4: the worker is where embeddings run, so it is never guarded
      # against the transformers/torch import. See app/torch_guard.py.
      PROCESS_ROLE: worker
    # Every name in QUEUE_NAMES must stay on this list. A queue nothing consumes
    # accepts jobs silently and runs none of them - no error, no log, jobs sit
    # queued forever. No unit test can see it, because a fake queue always
    # succeeds; scripts/check_worker_queues.py compares this line against
    # app/jobs/queues.py and is the only thing that does.
    command: rq worker gmail_sync nvoids_sync automation_run embedding_generation scheduled_task manual_intake --url redis://redis:6379/0 --with-scheduler
    volumes:
      - backend_data:/app/data
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: ./dashboard
    container_name: codejob-dashboard
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

  redis:
    image: redis:7
    container_name: codejob-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    container_name: codejob-postgres
    env_file:
      - ./backend/.env.postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codejob -d codejob"]
      interval: 10s
      timeout: 5s
      retries: 5

  searxng:
    image: searxng/searxng:latest
    container_name: codejob-searxng
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped

volumes:
  backend_data:
  redis_data:
  postgres_data:
