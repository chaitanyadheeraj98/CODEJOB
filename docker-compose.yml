services:
  backend:
    build:
      context: ./backend
    container_name: codejob-backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: sqlite:///./data/codejob.db
      REDIS_URL: redis://redis:6379/0
      ALLOW_RUNTIME_SCHEMA_PATCH: "false"
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
      - "8080:8080"
    volumes:
      - backend_data:/app/data
    depends_on:
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: ./dashboard
    container_name: codejob-dashboard
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

  redis:
    image: redis:7
    container_name: codejob-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  backend_data:
  redis_data:
